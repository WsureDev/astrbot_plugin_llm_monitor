<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM 负载监控</title>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
:root{color-scheme:light;--bg:#f4f7fb;--panel:rgba(255,255,255,.92);--strong:#fff;--text:#172033;--muted:#71809a;--line:#e4eaf3;--primary:#5865f2;--green:#16a673;--amber:#d28a19;--red:#df5269;--purple:#9a55c5;--shadow:0 18px 48px rgba(51,76,124,.12);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e1422;--panel:rgba(22,30,48,.92);--strong:#171f32;--text:#eef3ff;--muted:#9aa8c2;--line:#2a3650;--shadow:0 18px 48px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;min-width:760px;color:var(--text);background:radial-gradient(circle at 8% 0%,rgba(88,101,242,.16),transparent 30rem),var(--bg)}
.shell{max-width:1480px;margin:auto;padding:28px 30px 42px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:7px 0 5px;font-size:36px;letter-spacing:-.045em}.subtitle{margin:0;color:var(--muted);font-size:14px}.health{display:flex;align-items:center;gap:9px;padding:10px 14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);font-size:13px;white-space:nowrap}.health i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(22,166,115,.14)}
.summary{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:12px;margin-bottom:17px}.metric{padding:16px 17px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:12px}.metric .value{margin-top:7px;font-size:25px;font-weight:800}.metric.accent{color:#fff;background:linear-gradient(135deg,#5865f2,#8189ff);border-color:transparent}.metric.accent .label{color:rgba(255,255,255,.76)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:13px;margin-bottom:17px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}input,select,button{font:inherit}input,select{min-height:37px;padding:7px 11px;color:var(--text);background:var(--strong);border:1px solid var(--line);border-radius:9px}input{min-width:145px}button{cursor:pointer}.btn{min-height:37px;padding:7px 13px;color:#fff;background:var(--primary);border:0;border-radius:9px;font-weight:700}.btn.ghost{color:var(--text);background:transparent;border:1px solid var(--line)}.hint{margin-left:auto;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,.75fr);gap:17px;align-items:start}.panel{min-width:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--line)}.panel-title{margin:0;font-size:16px;font-weight:800}.panel-subtitle,.muted{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{padding:11px 14px;color:var(--muted);background:rgba(127,145,180,.06);font-size:11px;text-align:left;text-transform:uppercase}td{padding:14px;border-top:1px solid var(--line);vertical-align:top}tbody tr:hover{background:rgba(88,101,242,.08);cursor:pointer}.primary-text{font-weight:750}.secondary{margin-top:4px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.badge.running{color:#2768bd;background:#e2efff}.badge.completed{color:var(--green);background:rgba(22,166,115,.12)}.badge.aborted,.badge.round{color:var(--amber);background:rgba(210,138,25,.13)}.badge.error{color:var(--red);background:rgba(223,82,105,.13)}.badge.recovered{color:#667085;background:rgba(102,112,133,.14)}.badge.fallback{color:var(--purple);background:rgba(154,85,197,.14)}.clock{font-variant-numeric:tabular-nums;white-space:nowrap}
.detail{position:sticky;top:16px}#detail{max-height:calc(100vh - 180px);overflow:auto;padding:18px}.detail-summary{padding:15px;margin-bottom:15px;background:linear-gradient(145deg,rgba(88,101,242,.12),rgba(22,184,200,.08));border:1px solid rgba(88,101,242,.18);border-radius:14px}.detail-summary h3{margin:0 0 7px}.detail-summary p{margin:4px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.detail-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.mini{padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.mini b{display:block;font-size:15px}.mini span{color:var(--muted);font-size:10px}.section-title{margin:19px 0 9px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}details{margin:8px 0;background:var(--strong);border:1px solid var(--line);border-radius:11px;overflow:hidden}summary{padding:11px 12px;cursor:pointer;list-style:none;font-size:12px;font-weight:700}summary::-webkit-details-marker{display:none}summary:before{content:'＋';display:inline-block;width:18px;color:var(--primary)}details[open] summary:before{content:'－'}.payload{padding:0 12px 12px}.payload label{display:block;margin:8px 0 4px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}pre{max-height:230px;padding:10px;margin:0;color:var(--text);background:rgba(127,145,180,.1);border-radius:8px;white-space:pre-wrap;overflow:auto;overflow-wrap:anywhere;font:11px/1.5 ui-monospace,monospace}.empty{padding:44px 20px;color:var(--muted);text-align:center}
@media(max-width:1100px){.summary{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.detail{position:static}#detail{max-height:none}}@media(max-width:760px){body{min-width:0}.shell{padding:18px 12px}.hero{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.hint{width:100%;margin-left:0}}
</style>
</head>
<body>
<main class="shell">
<header class="hero"><div><div class="eyebrow">AstrBot observability</div><h1>LLM 负载监控</h1><p class="subtitle">看见每次请求由谁处理、耗时多久，以及 Agent 走过哪些工具。</p></div><div class="health"><i></i><span id="health-text">监控服务运行中</span></div></header>
<section class="summary">
<article class="metric accent"><div class="label">24 小时 Token</div><div class="value" id="sum-tokens">—</div></article><article class="metric"><div class="label">任务数</div><div class="value" id="sum-tasks">—</div></article><article class="metric"><div class="label">运行中</div><div class="value" id="sum-running">—</div></article><article class="metric"><div class="label">LLM 调用</div><div class="value" id="sum-calls">—</div></article><article class="metric"><div class="label">失败尝试</div><div class="value" id="sum-failed">—</div></article><article class="metric"><div class="label">Fallback</div><div class="value" id="sum-fallback">—</div></article>
</section>
<div class="toolbar"><select id="status"><option value="">全部状态</option><option>running</option><option>completed</option><option>aborted</option><option>recovered</option><option>error</option></select><input id="model" placeholder="筛选模型"><input id="platform" placeholder="筛选渠道"><button class="btn" id="refresh">刷新</button><button class="btn ghost" id="check">运行自检</button><span class="hint" id="meta">等待数据…</span></div>
<pre id="check-result" hidden></pre>
<div class="grid">
<section class="panel"><div class="panel-head"><div><h2 class="panel-title">最近任务</h2><div class="panel-subtitle">点击一行查看完整调用时间线</div></div><div class="panel-subtitle" id="updated">—</div></div><div class="table-wrap"><table><thead><tr><th>时间 / 用户</th><th>模型</th><th>状态</th><th>耗时</th><th>调用</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel detail"><div class="panel-head"><div><h2 class="panel-title">任务详情</h2><div class="panel-subtitle">LLM 与工具调用按时间排列</div></div></div><div id="detail"><div class="empty">选择左侧任务开始查看</div></div></section>
</div>
</main>
<script>
const bridge=window.AstrBotPluginPage,rows=document.getElementById('rows'),detail=document.getElementById('detail');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=value=>Number(value||0).toLocaleString(),when=value=>value?new Date(Number(value)*1000).toLocaleString():'—';
const seconds=(start,finish)=>Math.max(0,Number(finish||Date.now()/1000)-Number(start||Date.now()/1000));
const duration=(item,startKey='started_at',finishKey='finished_at')=>{const value=item.duration??seconds(item[startKey]||item.created_at,item[finishKey]);return(value<10?value.toFixed(1):Math.round(value))+'s'};
const badge=(status,label)=>'<span class="badge '+esc(status)+'">'+esc(label||status)+'</span>';
function tick(){document.querySelectorAll('[data-clock-start]').forEach(node=>{node.textContent=duration({started_at:node.dataset.clockStart})})}
function renderSummary(s){document.getElementById('sum-tokens').textContent=num(s.total_tokens);document.getElementById('sum-tasks').textContent=num(s.tasks);document.getElementById('sum-running').textContent=num(s.running_tasks);document.getElementById('sum-calls').textContent=num(s.llm_calls);document.getElementById('sum-failed').textContent=num(s.failed_calls);document.getElementById('sum-fallback').textContent=num(s.fallback_calls)}
function renderRow(item){const live=item.status==='running'?' data-clock-start="'+esc(item.started_at||item.created_at)+'"':'';return'<tr data-id="'+esc(item.task_id)+'"><td><div class="primary-text">'+esc(when(item.created_at))+'</div><div class="secondary">'+esc(item.platform_name)+' · '+esc(item.sender_name||item.sender_id||'unknown')+'</div><div class="secondary">'+esc(item.umo)+'</div></td><td><div class="primary-text">'+esc(item.provider_model||item.provider_id||'unknown')+'</div><div class="secondary">'+esc(item.provider_id||'')+'</div></td><td>'+badge(item.status)+'</td><td><span class="clock"'+live+'>'+esc(duration(item,'started_at','finished_at'))+'</span></td><td>'+num(item.llm_call_count||0)+' LLM<br><span class="secondary">'+num(item.tool_call_count||0)+' tools</span></td></tr>'}
async function load(){const params={},status=document.getElementById('status').value,model=document.getElementById('model').value.trim(),platform=document.getElementById('platform').value.trim();if(status)params.status=status;if(model)params.model=model;if(platform)params.platform=platform;const response=await Promise.all([bridge.apiGet('tasks',params),bridge.apiGet('summary',{hours:24})]),result=response[0];renderSummary(response[1]);rows.innerHTML=(result.items||[]).map(renderRow).join('')||'<tr><td colspan="5"><div class="empty">当前筛选没有任务</div></td></tr>';document.querySelectorAll('tr[data-id]').forEach(row=>row.onclick=()=>show(row.dataset.id));document.getElementById('updated').textContent='更新于 '+new Date().toLocaleTimeString();document.getElementById('meta').textContent=(result.items||[]).length+' 条 · 24 小时统计';tick()}
function renderCall(call){const fallback=call.attempt_kind==='fallback'?badge('fallback','Fallback'):'',status=call.status==='error'?'error':(call.attempt_kind==='fallback'?'fallback':'round');return'<details><summary>'+fallback+' #'+esc(call.sequence)+' · '+esc(call.provider_model||call.provider_id||'unknown')+' '+badge(status,call.status==='error'?'失败':'LLM')+' · '+esc(duration(call))+'</summary><div class="payload"><label>Provider</label><div class="secondary">'+esc(call.provider_id)+' / '+esc(call.provider_model)+'</div><label>用量</label><div class="secondary">输入 '+num(Number(call.input_other||0)+Number(call.input_cached||0))+' · 输出 '+num(call.output)+' · TTFT '+esc(call.ttft||0)+'s</div>'+(call.error?'<label>错误</label><pre>'+esc(call.error)+'</pre>':'')+'</div></details>'}
function renderTool(tool){return'<details><summary>'+badge('round','Tool')+' #'+esc(tool.sequence)+' · '+esc(tool.tool_name)+' · '+esc(duration(tool))+'</summary><div class="payload"><label>输入</label><pre>'+esc(tool.input_json)+'</pre><label>输出</label><pre>'+esc(tool.output_json)+'</pre>'+(tool.error?'<label>错误</label><pre>'+esc(tool.error)+'</pre>':'')+'</div></details>'}
async function show(id){const result=await bridge.apiGet('tasks/'+encodeURIComponent(id));if(!result.task)return;const task=result.task,calls=result.llm_calls||[],tools=result.tool_calls||[],input=calls.reduce((s,c)=>s+Number(c.input_other||0)+Number(c.input_cached||0),0),output=calls.reduce((s,c)=>s+Number(c.output||0),0),timeline=calls.map(call=>({type:'llm',at:call.started_at||0,value:call})).concat(tools.map(tool=>({type:'tool',at:tool.started_at||0,value:tool}))).sort((a,b)=>a.at-b.at),live=task.status==='running'?' data-clock-start="'+esc(task.started_at||task.created_at)+'"':'';detail.innerHTML='<div class="detail-summary"><h3>'+esc(task.provider_model||task.provider_id||'未识别模型')+'</h3><p>'+esc(task.umo)+'</p><p>'+esc(task.sender_name||task.sender_id||'unknown')+' · '+esc(task.platform_name||'')+' · '+esc(task.status)+'</p><div class="detail-metrics"><div class="mini"><b class="clock"'+live+'>'+esc(duration(task,'started_at','finished_at'))+'</b><span>任务耗时</span></div><div class="mini"><b>'+num(input+output)+'</b><span>总 token</span></div><div class="mini"><b>'+num(calls.length)+' / '+num(tools.length)+'</b><span>LLM / 工具</span></div></div></div><div class="section-title">调用时间线</div>'+(timeline.map(item=>item.type==='llm'?renderCall(item.value):renderTool(item.value)).join('')||'<div class="empty">没有调用记录</div>');tick()}
document.getElementById('refresh').onclick=load;document.getElementById('status').onchange=load;document.getElementById('model').onchange=load;document.getElementById('platform').onchange=load;
document.getElementById('check').onclick=async()=>{const box=document.getElementById('check-result');box.hidden=false;box.textContent=JSON.stringify(await bridge.apiGet('self-check'),null,2)};
async function init(){const context=await bridge.ready();document.documentElement.dataset.theme=context.isDark?'dark':'light';await load();setInterval(load,5000);setInterval(tick,1000)}
init().catch(error=>{document.getElementById('health-text').textContent='初始化失败: '+error});
</script>
</body>
</html>
