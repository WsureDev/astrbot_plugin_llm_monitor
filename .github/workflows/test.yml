name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: v4.28.0
          path: .test-astrbot
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: pip install -r requirements-dev.txt
      - run: ruff check main.py probe.py retry_probe.py store.py serialization.py reply_filter.py tests
      - run: ruff format --check main.py probe.py retry_probe.py store.py serialization.py reply_filter.py tests
      - run: python -m unittest discover -s tests -v
        env:
          ASTRBOT_SOURCE_PATH: .test-astrbot
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
